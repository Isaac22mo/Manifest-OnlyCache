<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/Manifest-OnlyCache/">
    <link rel="manifest" href="/Manifest-OnlyCache/manifest.json">
    <script src="/Manifest-OnlyCache/main.js"></script>
    <script src="/Manifest-OnlyCache/scripts/app.js"></script>

</head>

<body>
    <header>
        <h1>🍹 Buscador de Cócteles PWA</h1>
    </header>
    <main>
        <section class="search-box">
            <input type="text" id="cocktailName" placeholder="Escribe el nombre
del cóctel (ej. Margarita)" value="Mojito">
            <button id="searchButton">Buscar</button>
        </section>
        <section id="result" class="result-container">
            <p>Escribe un nombre de cóctel y presiona buscar para iniciar la prueba.</p>
        </section>
    </main>
    <script src="/main.js"></script>
    <script src="/scripts/app.js"></script>
</body>

</html>
